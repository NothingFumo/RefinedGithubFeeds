<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>RefinedGithubFeeds - 设置</title>
  <style>
    body { margin: 0; padding: 24px; font: 14px/1.6 system-ui, sans-serif; color: #1f2328; background: #f6f8fa; }
    .card { max-width: 720px; margin: 0 auto; background: #fff; border: 1px solid #d1d9e0; border-radius: 8px; padding: 20px 24px; }
    h1 { font-size: 18px; margin: 0 0 16px; display: flex; align-items: center; gap: 8px; }
    h2 { font-size: 14px; margin: 20px 0 8px; }
    label.row { display: flex; align-items: center; gap: 8px; margin: 6px 0; cursor: pointer; }
    .note { font-size: 12px; color: #59636e; }
    button { padding: 4px 12px; border: 1px solid #d1d9e0; border-radius: 6px; font-size: 13px; cursor: pointer; background: #f6f8fa; }
    button:hover { border-color: #0969da; }
    .section { border-top: 1px solid #d1d9e0; margin-top: 16px; padding-top: 12px; }
  </style>
</head>
<body>
  <div class="card">
    <h1><img src="../icons/icon48.png" alt="" /> RefinedGithubFeeds 设置</h1>

    <h2>卡片类型白名单（勾选 = 首页显示）</h2>
    <p class="note" id="type-note"></p>
    <div id="types"></div>
    <button id="reset-types" style="margin-top:10px;">恢复显示全部动态</button>

    <div class="section">
      <h2>发起者范围（与原生面板开关同步）</h2>
      <label class="row"><input type="checkbox" id="only-my-repos" /> 只看我仓库的动态</label>
      <label class="row"><input type="checkbox" id="only-followers" /> 只看关注者的动态</label>
    </div>

    <div class="section">
      <h2>关注者名单</h2>
      <p class="note">当前缓存：<span id="follower-count">-</span> 人，<span id="follower-age">未抓取</span>。用于「只看关注者的动态」。</p>
      <button id="refresh-followers">立即抓取</button>
    </div>
  </div>

  <script src="shared.js"></script>
  <script src="options.js"></script>
</body>
</html>
